[project]
name = "radar-licitacoes-mt"
version = "0.1.0"
description = "Radar de licitações do PNCP para Mato Grosso"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "alembic>=1.20.1",
    "apscheduler>=3.11,<4",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.34",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF",
    "DTZ",  # datetimes sempre com fuso
    "T20",  # proíbe print
    "LOG", "G",  # boas práticas de logging
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --cov=app --cov-report=term-missing"
markers = [
    "integration: testes que precisam de PostgreSQL (TEST_DATABASE_URL)",
]

[tool.coverage.run]
branch = true
source = ["app"]
