# Ambiente de desenvolvimento: app com reload automático + PostgreSQL.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        UV_SYNC_ARGS: ""  # inclui as dependências de desenvolvimento (pytest, ruff)
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}_test
      # E-mails vão para o Mailpit (nada é enviado de verdade): http://localhost:8025
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURITY: none
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  # Caixa de e-mail falsa para desenvolvimento: captura tudo o que a app envia.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"  # interface web
      - "1025:1025"  # SMTP

volumes:
  pgdata:
